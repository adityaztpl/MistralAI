[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-content-creator"
version = "0.1.0"
description = "Multi-agent Instagram content creator powered by CrewAI and Mistral AI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]>=1.15.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
instagram-content = "instagram_content_creator.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instagram_content_creator = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
